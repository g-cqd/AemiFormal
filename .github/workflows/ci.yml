name: CI

# swift-ci plans and runs the checks from .ci/action.json (https://github.com/g-cqd/swift-ci).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: g-cqd/swift-ci/.github/workflows/swift-ci.yml@07936b09eef98d5fcef4eac36a7c3f97de133e19
    permissions:
      contents: write # only used to publish a tag

  scan:
    name: Code Scanning
    uses: g-cqd/swift-ci/.github/workflows/code-scanning.yml@07936b09eef98d5fcef4eac36a7c3f97de133e19 # swift-ci 07936b0
    permissions:
      contents: read
      security-events: write
      actions: read
